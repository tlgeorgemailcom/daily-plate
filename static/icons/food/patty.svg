<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hamburger Patty - cooked, round with parallel grill marks -->
  
  <!-- Patty shadow/thickness -->
  <ellipse cx="32" cy="38" rx="26" ry="10" fill="#4A2810"/>
  
  <!-- Main patty body -->
  <ellipse cx="32" cy="34" rx="26" ry="10" fill="#6B3E26"/>
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="#8B4513"/>
  
  <!-- Parallel diagonal grill marks -->
  <line x1="10" y1="30" x2="22" y2="38" stroke="#3D1F0D" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="26" x2="32" y2="38" stroke="#3D1F0D" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="24" x2="44" y2="38" stroke="#3D1F0D" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="54" y2="36" stroke="#3D1F0D" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="26" x2="58" y2="32" stroke="#3D1F0D" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Slight sear/crust edge -->
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#5D2E0C" stroke-width="1.5"/>
  
  <!-- Top highlight for dimension -->
  <ellipse cx="30" cy="28" rx="10" ry="3" fill="#A0522D" opacity="0.3"/>
</svg>
