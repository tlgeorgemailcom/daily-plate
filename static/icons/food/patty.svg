<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hamburger Patty - cooked, round -->
  <ellipse cx="32" cy="36" rx="26" ry="10" fill="#6B3E26"/>
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="#8B4513"/>
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="url(#patty-gradient)"/>
  <!-- Grill marks on top -->
  <path d="M10 30 L54 34" stroke="#5D2E0C" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 34 L54 38" stroke="#5D2E0C" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Texture/char bits -->
  <circle cx="18" cy="30" r="1.5" fill="#4A2C17"/>
  <circle cx="28" cy="28" r="1.5" fill="#4A2C17"/>
  <circle cx="40" cy="32" r="1.5" fill="#4A2C17"/>
  <circle cx="48" cy="30" r="1.5" fill="#4A2C17"/>
  <!-- Highlight -->
  <ellipse cx="32" cy="28" rx="16" ry="4" fill="#A0522D" opacity="0.4"/>
  <defs>
    <linearGradient id="patty-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#5D2E0C;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
</svg>
